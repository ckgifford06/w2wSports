<html>
<head>
  <title>Top 10 Sports Matchups</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
    }
    h1 {
      color: #1e3a8a;
    }
    ol {
      list-style-position: inside;
      padding: 0;
    }
    li {
      background: #e0e7ff;
      margin: 8px auto;
      padding: 10px;
      width: 60%;
      border-radius: 10px;
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #1e3a8a;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/about">About Us</a>
  </nav>

  <h1>Today's Top 10 Sports Matchups</h1>

  <ol>
    {% for game in matchups %}
      <li>[{{ game.league }}] {{ game.matchup }} — Score: {{ game.score }}</li>
    {% endfor %}
  </ol>

  <p>Currently showing {{ matchups|length }} games for today.</p>
</body>
</html>
