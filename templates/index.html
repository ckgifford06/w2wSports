<html>
<head>
  <title>W2W Sports — Top 10 Matchups</title>
  <style>
    /* General page styling */
    body {
      font-family: Arial, sans-serif;
      background-color: #BC9B6A;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    /* Navigation bar */
    nav {
      background-color: #1f1f1f;
      padding: 15px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 20px;
      font-weight: bold;
      font-size: 18px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #98002E;
    }

    /* Page header */
    h1 {
      margin-top: 40px;
      font-size: 36px;
      color: #98002E;
    }

    /* Ordered list */
    ol {
      margin: 30px auto;
      padding: 0;
      width: 60%;
      text-align: left;
    }

    ol li {
      background-color: #98002E;
      margin: 10px 0;
      padding: 15px;
      border-radius: 8px;
      color: #BC9B6A;
      font-size: 20px;
      transition: transform 0.2s, background-color 0.2s;
    }

    ol li:hover {
      background-color: #BC9B6A;
      color: #121212;
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <nav>
    <a href="/"> Home</a> |
    <a href="/about"> About Us</a>
  </nav>

  <h1>🔥 Top 10 Matchups Today (All Sports)</h1>

  <ol style="width:60%; margin:30px auto; text-align:left; counter-reset: matchup-counter;">
    {% for game in matchups %}
      <li style="
          list-style: none; 
          background-color:#98002E; 
          margin:10px 0; 
          padding:15px 15px 15px 50px; 
          border-radius:8px; 
          color:#BC9B6A; 
          font-size:20px; 
          position:relative;
          transition: transform 0.2s, background-color 0.2s;
      ">
        <span style="
            position:absolute;
            left:15px;
            font-weight:bold;
            color:#BC9B6A;
        ">{{ loop.index }}.</span>
        [{{ game.league }}] {{ game.matchup }} — Score: {{ game.score }}
      </li>
    {% endfor %}
    </ol>
</body>
</html>

  <p>Currently showing {{ matchups|length }} games for today.</p>
</body>
</html>
